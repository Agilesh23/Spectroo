<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectroo v3 — Developer Logs</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 600;
            color: #111827;
        }
        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444;
            display: inline-block;
        }
        .status-dot.connected {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 6px 12px;
            background-color: #ffffff;
            color: #374151;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s ease;
            outline: none;
        }
        button:hover {
            background-color: #f9fafb;
            border-color: #9ca3af;
        }
        button.active {
            background-color: #3b82f6;
            color: #ffffff;
            border-color: #2563eb;
        }
        .log-container {
            flex-grow: 1;
            background-color: #1e1e1e;
            color: #e5e7eb;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 12px;
            line-height: 1.5;
            padding: 15px;
            border-radius: 8px;
            overflow-y: auto;
            border: 1px solid #374151;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-line {
            margin: 0;
            padding: 1px 0;
        }
        .log-error { color: #f87171; }
        .log-warning { color: #fbbf24; }
        .log-info { color: #60a5fa; }
        .log-debug { color: #9ca3af; }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="/static/logo.png" alt="LaserQuant Logo" style="height: 32px; width: auto;">
            <h1>Spectroo v3 — Developer System Logs</h1>
        </div>
        <div class="status-container">
            <span id="status-dot" class="status-dot"></span>
            <span id="status-text">Disconnected</span>
        </div>
    </header>
    
    <div class="controls">
        <button id="clear-btn">Clear Log</button>
        <button id="autoscroll-btn" class="active">Auto-Scroll</button>
        <button id="pause-btn">Pause</button>
    </div>
    
    <div id="log-container" class="log-container"></div>

    <script>
        const logContainer = document.getElementById('log-container');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const clearBtn = document.getElementById('clear-btn');
        const autoscrollBtn = document.getElementById('autoscroll-btn');
        const pauseBtn = document.getElementById('pause-btn');

        let ws = null;
        let autoscroll = true;
        let paused = false;
        let reconnectTimeout = null;

        function connect() {
            if (ws) {
                ws.close();
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/logs`;
            
            statusText.innerText = 'Connecting...';
            statusDot.className = 'status-dot';
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusText.innerText = 'Connected';
                statusDot.className = 'status-dot connected';
                if (reconnectTimeout) {
                    clearTimeout(reconnectTimeout);
                    reconnectTimeout = null;
                }
            };

            ws.onmessage = (event) => {
                if (paused) return;
                
                try {
                    const data = JSON.parse(event.data);
                    if (data.error) {
                        appendLine(`[ERROR] ${data.error}`, 'log-error');
                        return;
                    }
                    if (data.log) {
                        let lineClass = '';
                        const logText = data.log;
                        if (logText.includes('ERROR')) {
                            lineClass = 'log-error';
                        } else if (logText.includes('WARN')) {
                            lineClass = 'log-warning';
                        } else if (logText.includes('INFO') || logText.includes('DSP:')) {
                            lineClass = 'log-info';
                        } else if (logText.includes('DEBUG')) {
                            lineClass = 'log-debug';
                        }
                        appendLine(logText, lineClass);
                    }
                } catch (e) {
                    appendLine(event.data);
                }
            };

            ws.onclose = () => {
                statusText.innerText = 'Disconnected';
                statusDot.className = 'status-dot';
                if (!reconnectTimeout) {
                    reconnectTimeout = setTimeout(connect, 3000);
                }
            };

            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
                statusText.innerText = 'Error';
                statusDot.className = 'status-dot';
            };
        }

        function appendLine(text, className) {
            const p = document.createElement('p');
            p.className = 'log-line ' + (className || '');
            p.innerText = text;
            logContainer.appendChild(p);

            // Keep buffer size limited to 2000 lines
            while (logContainer.childElementCount > 2000) {
                logContainer.removeChild(logContainer.firstChild);
            }

            if (autoscroll) {
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        }

        clearBtn.onclick = () => {
            logContainer.innerHTML = '';
        };

        autoscrollBtn.onclick = () => {
            autoscroll = !autoscroll;
            autoscrollBtn.classList.toggle('active', autoscroll);
        };

        pauseBtn.onclick = () => {
            paused = !paused;
            pauseBtn.classList.toggle('active', paused);
            pauseBtn.innerText = paused ? 'Resume' : 'Pause';
        };

        connect();
    </script>
</body>
</html>
